name: Production CI/CD

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  NODE_VERSION: 20
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test:ci

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    if: github.event_name != 'pull_request'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container_security:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action
        with:
          scan-type: "image"
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-container"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker, security, container_security]
    timeout-minutes: 15

    environment:
      name: production
      url: https://your-domain.com

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          envs: IMAGE_TAG,GITHUB_SHA,GITHUB_ACTOR,GITHUB_TOKEN

          script: |
            set -Eeuo pipefail

            APP_DIR=/opt/node-app
            ENV_FILE=.env.production
            LOCK_FILE=/tmp/node-app-deploy.lock
            HEALTH_URL=http://localhost:3000/health
            MAX_RETRIES=12
            SLEEP_SECONDS=5

            cleanup() {
              rm -f "$LOCK_FILE"
            }

            rollback() {
              echo "Deployment failed. Starting rollback..."

              if [ -z "${PREVIOUS_TAG:-}" ]; then
                echo "No previous image tag found. Rollback impossible."
                exit 1
              fi

              echo "Rolling back to: $PREVIOUS_TAG"

              cat > "$ENV_FILE" <<EOF
            IMAGE_TAG=$PREVIOUS_TAG
            EOF

              docker compose pull
              docker compose up -d --remove-orphans

              echo "Waiting for rollback healthcheck..."

              for i in $(seq 1 $MAX_RETRIES); do
                if curl -fsS "$HEALTH_URL" > /dev/null; then
                  echo "Rollback successful"
                  exit 1
                fi

                sleep $SLEEP_SECONDS
              done

              echo "Rollback failed"
              exit 1
            }

            trap cleanup EXIT
            trap rollback ERR

            if [ -f "$LOCK_FILE" ]; then
              echo "Another deployment is already running"
              exit 1
            fi

            touch "$LOCK_FILE"

            cd "$APP_DIR"

            echo "Logging into GHCR..."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            if [ -f "$ENV_FILE" ]; then
              source "$ENV_FILE"
              PREVIOUS_TAG="${IMAGE_TAG:-}"
            else
              PREVIOUS_TAG=""
            fi

            echo "Previous image tag: ${PREVIOUS_TAG:-none}"
            echo "New image tag: $IMAGE_TAG"

            echo "Verifying image exists in registry..."

            docker manifest inspect ghcr.io/${{ github.repository }}:$IMAGE_TAG > /dev/null

            echo "Saving deployment history..."

            echo "$(date '+%Y-%m-%d %H:%M:%S') | SHA=$GITHUB_SHA | TAG=$IMAGE_TAG | ACTOR=$GITHUB_ACTOR" >> deploy-history.log

            echo "Updating environment file..."

            cat > "$ENV_FILE" <<EOF
            IMAGE_TAG=$IMAGE_TAG
            EOF

            echo "Pulling latest image..."

            docker compose pull

            echo "Starting updated containers..."

            docker compose up -d --remove-orphans

            echo "Waiting for application healthcheck..."

            for i in $(seq 1 $MAX_RETRIES); do
              if curl -fsS "$HEALTH_URL" > /dev/null; then
                echo "Deployment successful"

                echo "Cleaning old Docker images..."

                docker image prune -f --filter "until=168h"

                exit 0
              fi

              echo "Healthcheck attempt $i/$MAX_RETRIES failed"

              sleep $SLEEP_SECONDS
            done

            echo "Application failed healthcheck"

            exit 1
